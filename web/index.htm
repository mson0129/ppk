/* Fixed controls stay above the game in portrait, landscape and fullscreen. */

.game-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.game-heading h1{margin:0;min-width:0;font-size:clamp(17px,4.9vw,24px)}

#controls-help::backdrop{background:#000a}.help-card{padding:24px}.help-card h2{font-size:21px;margin:0 0 20px}.help-card dl{display:grid;grid-template-columns:auto 1fr;gap:14px 18px;margin:0}.help-card dt{font-weight:700;color:#b4dbff}.help-card dd{margin:0}.help-card p{font-size:13px;margin:20px 0 0}.help-card footer{display:flex;justify-content:center;margin-top:28px}.help-card footer button{min-width:112px}
@media(max-width:700px){main{padding-top:6px}.game-heading{padding:0 8px}.game-heading h1 .dos-link{font-size:10px}.play-options{margin:6px auto}.toolbar #status{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}}

#offline-state{font-size:10px;color:#a9bdc7;white-space:nowrap}#apply-update{font-size:11px;padding:4px 7px;white-space:nowrap}.play-options{flex-wrap:wrap;gap:6px 10px}.timer-label{margin-left:auto}

/* iOS can begin a text selection on labels underneath a floating controller. */
html,body,main,main *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
select,option{touch-action:manipulation}
.is-replay .screen .touch,.is-replay .screen:fullscreen .touch{display:none}

<body><main>
<header class="game-heading"><h1>돌아온 너구리 · WASM <a class="dos-link" href="./dos.htm">(원본 DOS 버전 보기)</a></h1><button id="install-app" type="button" hidden aria-label="홈 화면에 앱 설치" title="홈 화면에 앱 설치"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg></button><button id="input-help" type="button" aria-label="키보드 조작법 보기" aria-haspopup="dialog" title="키보드 조작법 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 9h1m3 0h1m3 0h1m3 0h1M5 12h1m3 0h1m3 0h1m3 0h1M7 16h10"/></svg></button></header>

<div class="play-options">
<label for="stage-select">스테이지 <select id="stage-select" disabled aria-label="시작 스테이지 선택"></select></label>
<span id="replay-controls" hidden><span>리플레이</span><select id="replay-rate" aria-label="리플레이 재생 속도"><option value="1">1배속</option><option value="2">2배속</option><option value="4">4배속</option></select><button id="replay-exit" type="button">재생 종료</button></span>
<span id="offline-state" role="status" hidden></span><button id="apply-update" type="button" hidden title="게임을 다시 불러와 새 버전을 적용합니다">새 버전 적용</button><span class="timer-label"><span id="timer-mode">타임어택</span> <output id="play-timer" role="timer" aria-live="off">00:00.000</output></span>
</div>
<div class="screen" id="screen"><div class="toolbar" role="group" aria-label="게임 메뉴"><span id="status" role="status">게임을 불러오는 중…</span><output id="fullscreen-play-timer" aria-label="타임어택 기록" role="timer" aria-live="off">00:00.000</output><button type="button" id="replay" aria-label="리플레이" title="리플레이" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a9 9 0 1 1-1 8M4 3v5h5m2 1 6 4-6 4V9Z"/></svg></button><button type="button" id="pause" aria-label="일시정지" title="일시정지" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"/></svg></button><button type="button" id="restart" aria-label="처음부터" title="처음부터" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button><button type="button" id="sound" aria-label="소리 끄기" title="소리 끄기" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></button><button type="button" id="fullscreen" aria-label="전체 화면" title="전체 화면" ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5"/></svg></button></div><canvas id="game" width="320" height="200" tabindex="0" aria-label="돌아온 너구리 게임 화면"></canvas><div class="overlay" id="overlay"><button id="start" disabled>불러오는 중…</button></div><div class="touch" role="group" aria-label="터치 게임 컨트롤">
<button type="button" class="controller-handle" role="slider" aria-label="컨트롤러 상하 위치" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" title="위아래로 드래그하여 컨트롤러 이동"></button>
<div class="dpad" role="group" aria-label="이동 십자키">
<button type="button" data-key="72" aria-label="위로 이동" aria-pressed="false" disabled>↑</button>
<button type="button" data-key="75" aria-label="왼쪽으로 이동" aria-pressed="false" disabled>←</button>
<span class="dpad-center" aria-hidden="true">✚</span>
<button type="button" data-key="77" aria-label="오른쪽으로 이동" aria-pressed="false" disabled>→</button>
<button type="button" data-key="80" aria-label="아래로 이동" aria-pressed="false" disabled>↓</button>
</div>
<button type="button" class="space-button" data-key="57" aria-label="Space: 시작 및 점프" aria-pressed="false" disabled>SPACE</button>
</div>
<dialog id="controls-help" aria-labelledby="controls-help-title"><div class="help-card"><h2 id="controls-help-title">키보드 조작법</h2><div id="controls-help-body"></div><footer><button id="controls-help-close" type="button">닫기</button></footer></div></dialog>
</div>




<dialog id="replay-dialog" aria-labelledby="replay-title"><h2 id="replay-title">리플레이</h2><p id="replay-summary"></p><div class="replay-actions"><button id="replay-watch" type="button" disabled>재생</button><button id="replay-download" type="button" disabled>파일 저장</button><button id="replay-import" type="button">파일 불러오기</button><input id="replay-file" type="file" accept=".json,application/json" hidden></div><p>최근 플레이 한 번을 이 기기에 자동 저장합니다. 최대 약 3시간까지 기록합니다. 재생하면 현재 플레이는 종료됩니다. 재생 중에는 일시정지와 배속 변경을 사용할 수 있습니다.</p><p>타이머는 당시의 실제 시간을 표시하며 일시정지·스테이지 대기 시간도 포함합니다. 파일은 같은 게임 버전에서 재생할 수 있습니다.</p><p id="replay-note" role="status"></p><footer><button id="replay-close" type="button">닫기</button></footer></dialog>
</main><script type="module" src="./port/player.js"></script><script type="module" src="./pwa.js"></script></body>
