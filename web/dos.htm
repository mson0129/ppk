<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccoon · PPK</title>
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <style>
        body { margin: 0; padding: 24px; background: #17191d; color: #eee; font-family: system-ui, sans-serif; }
        main { max-width: 960px; margin: auto; }
        h1 { margin: 0 0 12px; }
        p { line-height: 1.6; }
        #game { width: 100%; height: min(75vw, 720px); min-height: 360px; background: #000; }
        #status { color: #c8ccd4; }
        a { color: #a4ceff; }
        @media (max-width: 600px) { body { padding: 12px; } }
    </style>
</head>
<body>
    <main>
        <h1>Raccoon · PPK</h1>
        <p>▶ Play를 눌러 시작하세요. 타이틀 화면에서 Space를 누르면 시작합니다. 게임 화면을 클릭하면 키보드로 조작할 수 있습니다. 전체 화면과 가상 키보드는 플레이어 메뉴에서 열 수 있습니다.</p>
        <div id="game"></div>
        <p id="status" role="status">플레이어를 불러오는 중…</p>
        <p><a href="./dos.htm">다시 불러오기</a></p>
    </main>
    <script src="https://v8.js-dos.com/latest/js-dos.js" onerror="document.getElementById('status').textContent='플레이어를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 불러오세요.'"></script>
    <script>
        const status = document.getElementById('status');
        if (typeof Dos === 'function') {
            try {
                const player = Dos(document.getElementById('game'), {
                    url: new URL('./ppk.jsdos?v=vga-2', window.location.href).href,
                    backend: 'dosboxX',
                    theme: 'dark',
                    renderBackend: 'canvas',
                    lang: 'en',
                    renderAspect: '4/3',
                    onEvent(event) {
                        if (event === 'emu-ready') status.textContent = '▶ Play를 눌러 게임을 시작하세요.';
                        if (event === 'bnd-play') status.textContent = '게임을 불러오는 중…';
                        if (event === 'ci-ready') status.textContent = 'DOS 실행 환경이 시작되었습니다. 게임 화면을 클릭해 조작하세요.';
                    }
                });
                player.setNoCloud(true);
            } catch (error) {
                status.textContent = '실행 준비 중 오류가 발생했습니다. 페이지를 다시 불러오세요.';
                console.error(error);
            }
        }
    </script>
</body>
</html>
